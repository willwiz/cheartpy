[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "cheartpy-gmsh"
version = "0.0.1"
authors = [{ name = "Will Zhang", email = "willwz@gmail.com" }]
description = "Python module for creating Cheart pfiles and executing them."
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Linux",
  "Development Status :: 0 - Alpha",
]
dependencies = [
  "pytools >= 1.2.0a",
  "optype[numpy]",
  "cheartpy-mesh",
  "cheartpy-io",
  "cheartpy-vtk",
  "pydantic",
  "gmsh-stubs[gmsh]",
]
[tool.uv.build-backend]
module-name = "cheartpy.gmsh"
namespace = true
[tool.uv.sources]
gmsh-stubs = { git = "https://github.com/willwiz/gmsh-stubs.git" }
[project.scripts]
cheart2gmsh = "cheartpy.gmsh.__main__:main"
