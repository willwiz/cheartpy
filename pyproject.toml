[build-system]
requires = ["uv_build>=0.10.9,<0.13.1"]
build-backend = "uv_build"

[project]
name = "cheartpy"
version = "1.3.0a"
authors = [{ name = "Will Zhang", email = "willwz@gmail.com" }]
description = "Python module for creating Cheart pfiles and executing them."
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Linux",
    "Development Status :: 0 - Alpha",
]
license = "MIT"
dependencies = ["pytools>=1.2.2b", "numpy", "meshio", "cheartpy-io"]

[project.optional-dependencies]
all = [
    "cheartpy-abaqus",
    "cheartpy-cl",
    "cheartpy-fe",
    "cheartpy-io",
    "cheartpy-mesh",
    "cheartpy-paraview",
    "cheartpy-vtk",
    "cheartpy-gmsh",
]
mesh = ["cheartpy-mesh"]
paraview = ["cheartpy-mesh", "cheartpy-paraview", "cheartpy-vtk"]
abaqus = ["cheartpy-abaqus"]
fe = ["cheartpy-mesh", "cheartpy-paraview", "cheartpy-fe"]

[tool.uv]
package = false

[tool.uv.sources]
cheartpy = { path = ".", package = false }
cheartpy-abaqus = { path = "cheartpy-abaqus", editable = true }
cheartpy-gmsh = { path = "cheartpy-gmsh", editable = true }
cheartpy-cl = { path = "cheartpy-cl", editable = true }
cheartpy-fe = { path = "cheartpy-fe", editable = true }
cheartpy-io = { path = "cheartpy-io", editable = true }
cheartpy-mesh = { path = "cheartpy-mesh", editable = true }
cheartpy-paraview = { path = "cheartpy-paraview", editable = true }
cheartpy-vtk = { path = "cheartpy-vtk", editable = true }
cheartpy-symbolic = { path = "cheartpy-symbolic", editable = true }
pytools = { git = "https://github.com/willwiz/pytools" }

[tool.uv.build-backend]
module-name = []
namespace = true

[tool.esbonio.sphinx]
pythonCommand = ["uv", "run", "python"]

[dependency-groups]
dev = [
    "cheartpy-abaqus",
    "cheartpy-gmsh",
    "cheartpy-cl",
    "cheartpy-fe",
    "cheartpy-io",
    "cheartpy-mesh",
    "cheartpy-paraview",
    "cheartpy-symbolic",
    "cheartpy-vtk",
    "pytest",
    "sphinx>=9.2.0",
    "sphinx-rtd-theme>=3.1.0",
    "myst-parser>=5.1.0",
    "attrs>=26.1.0",
    "sphinx-autodoc-typehints>=3.17.2",
]

[project.scripts]
chvcmp = "cheartpy.varcomp:varcomp_cli"
